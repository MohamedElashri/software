# Curated list of software shown on melashri.net/software.
#
# This file is edited by hand. Download links are NOT stored here; they are
# resolved from the latest release by scripts/sync-releases.py and written to
# data/releases.json. Asset rules use regular expressions matched against
# release asset file names, so they keep working when the version changes.
#
# Fields
#   id          slug, used for the page URL and as the key in releases.json
#   name        display name
#   section     apps | cli | extensions
#   repo        owner/name on GitHub
#   source      github (default) | amo  (Firefox Add-ons is the source of truth)
#   amo         AMO slug, when source = "amo"
#   tagline     one line, shown in the index
#   homepage    optional project site
#   screenshot  optional base name in data/shots.json; "<name>-light"/"<name>-dark" are
#               used when present, otherwise "<name>" itself
#   status      optional label, e.g. "beta"
#   primary_group  asset group offered as the quick downloads when every asset is grouped
#   platforms   shown on the index; downloads below are the real list
#   install     ordered install methods, first one is the default
#   asset       one rule per downloadable file
#                 os     macos | linux | windows | firefox | chrome | vscode
#                 arch   arm64 | x64 | universal | any
#                 kind   dmg | zip | tar.gz | appimage | deb | rpm | msi | exe | xpi | vsix
#                 group  optional sub-heading (e.g. "Snippy TUI")
#                 variant optional build variant shown with the arch (e.g. "musl")
#                 match  regex against the asset name; must match exactly one asset
#   checksums   optional regex for the checksum file to link next to downloads

# ---------------------------------------------------------------------------
# Apps
# ---------------------------------------------------------------------------

[[project]]
id = "mdiff"
name = "mdiff"
section = "apps"
repo = "MohamedElashri/mdiff"
tagline = "Native code review for macOS and Linux."
screenshot = "mdiff"
platforms = ["macos", "linux"]
checksums = '^SHA256SUMS$'
install = [
  { label = "Homebrew", cmd = "brew tap MohamedElashri/mdiff https://github.com/MohamedElashri/mdiff && brew install --cask MohamedElashri/mdiff/mdiff" },
  { label = "Script", cmd = "curl -fsSL https://raw.githubusercontent.com/MohamedElashri/mdiff/main/install.sh | bash" },
]
asset = [
  { os = "macos", arch = "arm64", kind = "zip", match = '-aarch64-apple-darwin\.zip$' },
  { os = "macos", arch = "x64", kind = "zip", match = '-x86_64-apple-darwin\.zip$' },
  { os = "linux", arch = "x64", kind = "appimage", match = '-x86_64-unknown-linux-gnu\.AppImage$' },
  { os = "linux", arch = "x64", kind = "deb", match = '-x86_64-unknown-linux-gnu\.deb$' },
]

