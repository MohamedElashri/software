# Refresh download links from the latest releases and redeploy when they change.
#
# Runs every six hours, on demand, and when a project's release workflow sends a
# `release-published` repository_dispatch event (see README.md). Projects that
# fail to resolve keep their previous links and are listed in an open issue,
# which is closed again once every project resolves. If the repository has
# issues turned off, the run fails with the list in its summary instead.
name: Sync releases

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [release-published]

permissions:
  contents: read

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main

      - name: Resolve latest releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/sync-releases.py --report "$RUNNER_TEMP/sync-report.md"

      - name: Commit changes
        id: commit
        run: |
          if git diff --quiet -- data/releases.json static/releases.xml; then
            echo "No release changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/releases.json static/releases.xml
          git commit --quiet -m "Update release data"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report unresolved projects
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Release sync could not resolve some projects"
          report="$RUNNER_TEMP/sync-report.md"
          # Without issues, fail the run instead; GitHub notifies about failed scheduled runs.
          if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .has_issues)" != "true" ]; then
            if [ -f "$report" ]; then
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::Some projects could not be resolved; see the run summary."
              exit 1
            fi
            exit 0
          fi
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -f "$report" ]; then
            printf '\nLast checked in %s\n' "$RUN_URL" >> "$report"
            if [ -n "$number" ]; then
              gh issue edit "$number" --body-file "$report"
            else
              gh issue create --title "$title" --body-file "$report"
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "Every project resolved in $RUN_URL"
          fi

  deploy:
    needs: sync
    # Deploy committed data even when only the failure report step failed.
    if: ${{ !cancelled() && needs.sync.outputs.changed == 'true' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/site.yml
    with:
      ref: ${{ needs.sync.outputs.sha }}
