base_url = "https://melashri.net/software/"
title = "Software by Mohamed Elashri"
description = "Desktop apps, command-line tools and browser extensions by Mohamed Elashri."
language = "en"
author = "Mohamed Elashri"

content_dir = "content"
template_dir = "templates"
static_dir = "static"
output_dir = "public"
minify_html = true
# The index lists every project itself; keep nida from paginating the root section.
paginate = 1000

[feed]
enabled = false

[sitemap]
enabled = true

# Crawlers read robots.txt only at the domain root (melashri.net/robots.txt).
[robots]
enabled = false

[pipeline]
fingerprint = true
minify_css = true
minify_js = true

[server]
host = "127.0.0.1"
port = 1717
livereload = true

# Visitor counting with the self-hosted Umami used across melashri.net.
# Tracking is on when website_id is set; the footer shows a visitor count when
# share_id (from the website's "Share URL" in Umami) is set too.
[extra.umami]
host = "https://uma.elashri.net"
website_id = ""
share_id = ""
