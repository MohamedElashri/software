<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:CM;font-weight:400;src:url(../../static/fonts/commit-mono-400-regular.woff2)}
@font-face{font-family:CM;font-weight:700;src:url(../../static/fonts/commit-mono-700-regular.woff2)}
html,body{margin:0;background:#161718;color:#e7e8e5;font-family:CM,monospace}
.wrap{width:1600px;height:1000px;box-sizing:border-box;padding:64px 56px;display:grid;grid-template-columns:1fr 1fr;gap:40px;align-content:center;align-items:start}
figure{margin:0}
figcaption{font-size:26px;margin-bottom:18px;display:flex;gap:14px;align-items:baseline}
figcaption b{font-weight:700}
figcaption span{color:#a3a8aa;font-size:20px}
.frame{aspect-ratio:2030/1318;border:2px solid #2f3134;border-radius:18px;overflow:hidden;background:#fbfaf7}
.frame img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
</style></head><body><div class="wrap">
<figure><figcaption><b>Before</b><span>images load as usual</span></figcaption><div class="frame"><img src="imgblock-before.png"></div></figure>
<figure><figcaption><b>After one click</b><span>only icons stay</span></figcaption><div class="frame"><img src="imgblock-after.png"></div></figure>
</div></body></html>
